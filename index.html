<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=600, height=600, initial-scale=1.0, user-scalable=no">
<meta name="description" content="RB Cable jobs at a glance: today, this week, and what needs action.">
<meta name="mrbd-web-app-capable" content="yes">
<title>RB Jobs</title>
<link rel="icon" href="icon-96.png" sizes="96x96">
<style>
:root{
  --ink:#FFFFFF; --dim:#B9C2BE; --line:#4A5550;
  --orange:#FF8A3D; --red:#FF5E52; --blue:#62B4FF; --green:#5FE08F; --amber:#FFCB52; --brown:#E0A070;
}
*{box-sizing:border-box}
html,body{margin:0;background:#000}
body{width:600px;height:600px;overflow:hidden;color:var(--ink);
  font:20px/1.3 -apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif}
#app{position:absolute;inset:0;padding:22px 26px;display:flex;flex-direction:column;gap:12px}
h1{margin:0;font-size:28px;line-height:1.15;font-weight:700}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px}
.top .sm{color:var(--dim);font-size:17px;white-space:nowrap}
.scroll{flex:1;overflow:hidden;display:flex;flex-direction:column;gap:10px;padding:3px}
.f{outline:none}
.btn,.row{display:flex;align-items:center;gap:14px;min-height:88px;padding:10px 18px;border:2px solid var(--line);
  border-radius:16px;background:transparent;color:var(--ink);font:inherit;text-align:left;width:100%;flex:none}
.btn:focus,.row:focus{border-color:var(--orange);box-shadow:0 0 0 3px var(--orange);background:#2a1608}
.btn .n{font-size:40px;font-weight:700;min-width:62px;text-align:center;font-variant-numeric:tabular-nums}
.btn .l{font-size:24px;font-weight:600}
.btn .h{font-size:16px;color:var(--dim)}
.red{color:var(--red)} .blue{color:var(--blue)} .amber{color:var(--amber)} .green{color:var(--green)} .orange{color:var(--orange)}
.row{border-left-width:8px}
.row .tx{flex:1;min-width:0}
.row .t{font-size:22px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:17px;color:var(--dim);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .d{font-size:19px;font-weight:700;white-space:nowrap;text-align:right}
.st-action{border-left-color:var(--orange)} .st-scheduled{border-left-color:var(--blue)}
.st-waiting{border-left-color:var(--amber)} .st-open{border-left-color:var(--dim)}
.st-check{border-left-color:var(--brown)} .st-done{border-left-color:var(--green)}
.st-overdue{border-left-color:var(--red)}
.empty{color:var(--dim);font-size:22px;text-align:center;padding:60px 20px}
/* detail */
.det{flex:1;overflow:hidden;position:relative}
.det .inner{display:flex;flex-direction:column;gap:12px;padding-bottom:40px}
.pill{display:inline-block;font-size:15px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;
  border:2px solid currentColor;border-radius:999px;padding:2px 10px}
.next{border:2px solid var(--orange);border-radius:12px;padding:10px 14px;font-size:21px}
.next b{color:var(--orange)}
.kv{font-size:19px}
.kv b{color:var(--dim);font-weight:600;font-size:15px;text-transform:uppercase;letter-spacing:.6px;display:block}
.hint{color:var(--dim);font-size:15px;text-align:center}
.small-btn{min-height:64px;justify-content:center;font-weight:600;font-size:20px}
/* pin */
input{width:100%;min-height:88px;font:600 34px/1 inherit;letter-spacing:6px;text-align:center;color:var(--ink);
  background:transparent;border:2px solid var(--line);border-radius:16px;outline:none}
input:focus{border-color:var(--orange);box-shadow:0 0 0 3px var(--orange)}
.msg{font-size:18px;color:var(--dim);text-align:center;min-height:24px}
.more{position:absolute;bottom:0;left:0;right:0;text-align:center;font-size:15px;color:var(--orange);background:#000;padding-top:4px}
</style>
</head>
<body>
<div id="app"><div class="empty">Loading…</div></div>
<script>
"use strict";
const app = document.getElementById("app");
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const PIN_KEY = "rbjobs.pin";
let DATA = null; // {generated, jobs:[]}

/* ---------- storage (wrapped) ---------- */
const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(_){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(_){} },
  del(k){ try{ localStorage.removeItem(k); }catch(_){} }
};

/* ---------- crypto ---------- */
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function decrypt(pack, pin){
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pin), "PBKDF2", false, ["deriveKey"]);
  const key = await crypto.subtle.deriveKey({name:"PBKDF2", salt:b64(pack.salt), iterations:pack.iter, hash:"SHA-256"},
    base, {name:"AES-GCM", length:256}, false, ["decrypt"]);
  const pt = await crypto.subtle.decrypt({name:"AES-GCM", iv:b64(pack.iv)}, key, b64(pack.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}

/* ---------- dates ---------- */
function today(){ const d=new Date(); d.setHours(0,0,0,0); return d; }
function parse(s){ if(!s) return null; const [y,m,d]=s.slice(0,10).split("-").map(Number); return new Date(y,m-1,d); }
function days(s){ const d=parse(s); return d ? Math.round((d-today())/864e5) : null; }
function fmt(s){ const d=parse(s); return d ? d.toLocaleDateString("en-US",{weekday:"short",month:"short",day:"numeric"}) : ""; }
function shortDay(s){
  const n=days(s); if(n===null) return "";
  if(n===0) return "Today"; if(n===1) return "Tmrw"; if(n===-1) return "Yest.";
  const d=parse(s); return (n>1&&n<7) ? d.toLocaleDateString("en-US",{weekday:"short"}) : d.toLocaleDateString("en-US",{month:"numeric",day:"numeric"});
}

/* ---------- job logic (matches the main board) ---------- */
const open = j => j.status !== "done";
const overdue = j => open(j) && j.due && days(j.due) < 0;
const keyDate = j => j.due || j.start || null;
function isToday(j){
  if(!open(j)) return false;
  if(j.due && days(j.due)===0) return true;
  if(j.start){ const s=days(j.start), e=j.end?days(j.end):s; return s<=0 && e>=0; }
  return false;
}
function nextWeek(j){ const k=keyDate(j); if(!k||!open(j)) return false; const n=days(k); return n>=1 && n<=7; }
const STATUS = {action:["Action needed","orange"],scheduled:["Scheduled","blue"],waiting:["Waiting on others","amber"],
  open:["Open request","dim"],check:["Confirm done?","amber"],done:["Done","green"]};
const byDate = (a,b) => (keyDate(a)||"9999").localeCompare(keyDate(b)||"9999") || (a.title||"").localeCompare(b.title||"");

const LISTS = {
  today:  {label:"Today",        cls:"blue",   hint:"On site or due today",   f:isToday},
  overdue:{label:"Past due",     cls:"red",    hint:"Deadline has passed",    f:overdue},
  week:   {label:"Next 7 days",  cls:"",       hint:"Scheduled or due",       f:nextWeek},
  action: {label:"Need action",  cls:"orange", hint:"You owe a next step",    f:j=>open(j)&&(j.status==="action"||j.status==="check")},
  all:    {label:"All open",     cls:"",       hint:"Everything not done",    f:open}
};

/* ---------- views ---------- */
let focusMemory = {};
function view(){ return history.state || {v:"home"}; }
function go(state){ history.pushState(state, ""); render(); }

function render(){
  if(!DATA) return;
  const st = view();
  if(st.v==="list") return renderList(st.k);
  if(st.v==="job") return renderJob(st.id);
  renderHome();
}

function updatedLine(){
  if(!DATA.generated) return "";
  const d=new Date(DATA.generated);
  return d.toLocaleString("en-US",{weekday:"short",hour:"numeric",minute:"2-digit"});
}

function renderHome(){
  const jobs = DATA.jobs;
  const order = ["today","overdue","week","action","all"];
  app.innerHTML = `<div class="top"><h1>RB Jobs</h1><span class="sm">Updated ${esc(updatedLine())}</span></div>
    <div class="scroll" id="sc">${order.map(k=>{
      const L=LISTS[k], n=jobs.filter(L.f).length;
      if(k==="overdue" && !n) return "";
      return `<button class="btn f" data-k="${k}"><span class="n ${n?L.cls:""}">${n}</span><span><div class="l">${L.label}</div><div class="h">${L.hint}</div></span></button>`;
    }).join("")}</div>`;
  app.querySelectorAll("[data-k]").forEach(b => b.onclick = () => go({v:"list",k:b.dataset.k}));
  restoreFocus("home");
}

function renderList(k){
  const L = LISTS[k] || LISTS.all;
  const items = DATA.jobs.filter(L.f).sort(byDate);
  app.innerHTML = `<div class="top"><h1 class="${L.cls}">${L.label}</h1><span class="sm">${items.length} job${items.length===1?"":"s"}</span></div>
    <div class="scroll" id="sc">${items.length ? items.map(j=>{
      const od=overdue(j), k=keyDate(j);
      const dl = L===LISTS.today ? (j.due ? "Due "+shortDay(j.due) : "On site") : (k?shortDay(k):"");
      return `<button class="row f st-${od?"overdue":esc(j.status)}" data-id="${esc(j.id)}">
        <span class="tx"><div class="t">${esc(j.title)}</div><div class="s">${esc(j.site||j.client||"")}</div></span>
        <span class="d ${od?"red":""}">${esc(dl)}</span></button>`;
    }).join("") : `<div class="empty">Nothing here.</div>`}</div>`;
  app.querySelectorAll("[data-id]").forEach(b => b.onclick = () => go({v:"job",id:b.dataset.id}));
  restoreFocus("list:"+k);
}

function renderJob(id){
  const j = DATA.jobs.find(x=>x.id===id);
  if(!j){ history.replaceState({v:"home"},""); return renderHome(); }
  const [sl, sc] = STATUS[j.status] || STATUS.open;
  const od = overdue(j);
  const when = [
    j.start ? `${fmt(j.start)}${j.end&&j.end!==j.start?" – "+fmt(j.end):""}` : "",
    j.due ? `Due ${fmt(j.due)}` : ""
  ].filter(Boolean).join(" · ");
  const last = (j.updates||[]).slice(-1)[0];
  app.innerHTML = `
    <div class="top"><h1>${esc(j.title)}</h1></div>
    <div><span class="pill ${od?"red":sc}" style="${sc==="dim"?"color:var(--dim)":""}">${od?"Past due":esc(sl)}</span>
      ${j.ref?` <span class="sm" style="color:var(--dim);font-size:17px">${esc(j.ref)}</span>`:""}</div>
    <button class="btn f small-btn" id="say">🔊  Read aloud</button>
    <div class="det" id="det"><div class="inner" id="inner">
      ${when?`<div class="kv ${od?"red":""}"><b>When</b>${esc(when)}</div>`:""}
      ${j.next?`<div class="next"><b>Next:</b> ${esc(j.next)}</div>`:""}
      ${j.site?`<div class="kv"><b>Site</b>${esc(j.site)}</div>`:""}
      ${j.contact?`<div class="kv"><b>Contact</b>${esc(j.contact)}</div>`:""}
      ${j.scope?`<div class="kv"><b>Scope</b>${esc(j.scope)}</div>`:""}
      ${last?`<div class="kv"><b>Last update · ${esc(fmt(last.on))}</b>${esc(last.text)}</div>`:""}
      ${j.notes?`<div class="kv"><b>Notes</b>${esc(j.notes)}</div>`:""}
      ${j.client?`<div class="kv"><b>Client</b>${esc(j.client)}</div>`:""}
    </div><div class="more" id="more">▼ more</div></div>`;
  document.getElementById("say").onclick = () => speak(j, when);
  document.getElementById("say").focus();
  updateMore();
}

function updateMore(){
  const det=document.getElementById("det"), m=document.getElementById("more");
  if(!det||!m) return;
  m.style.display = det.scrollTop + det.clientHeight < det.scrollHeight - 4 ? "" : "none";
}

function speak(j, when){
  try{
    const ss = window.speechSynthesis; if(!ss) return;
    if(ss.speaking){ ss.cancel(); return; }
    const parts = [j.title, when, j.next ? "Next: "+j.next : "", j.site ? "At "+j.site : "", j.contact ? "Contact: "+j.contact : ""];
    const u = new SpeechSynthesisUtterance(parts.filter(Boolean).join(". ").replace(/·/g,","));
    u.lang="en-US"; u.rate=1.05; ss.speak(u);
  }catch(_){}
}

/* ---------- focus + keys ---------- */
function focusables(){ return [...app.querySelectorAll(".f")]; }
function restoreFocus(key){
  const fs = focusables(); if(!fs.length) return;
  const i = Math.min(focusMemory[key] ?? 0, fs.length-1);
  fs[i].focus({preventScroll:true}); fs[i].scrollIntoView({block:"nearest"});
}
function rememberFocus(){
  const st=view(); const key = st.v==="home"?"home":st.v==="list"?"list:"+st.k:null;
  if(!key) return; const i=focusables().indexOf(document.activeElement); if(i>=0) focusMemory[key]=i;
}
document.addEventListener("keydown", e => {
  if(e.target.tagName==="INPUT") return;
  const det = document.getElementById("det");
  if(det && (e.key==="ArrowDown"||e.key==="ArrowUp")){
    e.preventDefault(); det.scrollTop += (e.key==="ArrowDown"?1:-1)*150; updateMore(); return;
  }
  if(e.key!=="ArrowDown" && e.key!=="ArrowUp") return;
  const fs=focusables(); if(!fs.length) return;
  e.preventDefault();
  let i=fs.indexOf(document.activeElement);
  i = i<0 ? 0 : Math.max(0, Math.min(fs.length-1, i + (e.key==="ArrowDown"?1:-1)));
  fs[i].focus({preventScroll:true}); fs[i].scrollIntoView({block:"nearest"});
  rememberFocus();
});
document.addEventListener("click", rememberFocus, true);
window.addEventListener("popstate", () => { try{ speechSynthesis.cancel(); }catch(_){} render(); });

/* ---------- PIN + load ---------- */
let PACK = null;
function pinScreen(msg){
  app.innerHTML = `<div class="top"><h1>RB Jobs</h1></div>
    <div class="scroll" style="justify-content:center;gap:18px">
      <div class="msg" style="font-size:22px;color:var(--ink)">Enter your PIN</div>
      <input id="pin" class="f" type="number" inputmode="numeric" autocomplete="off" aria-label="PIN">
      <button class="btn f small-btn" id="go">Unlock</button>
      <div class="msg" id="msg">${esc(msg||"")}</div>
    </div>`;
  const inp=document.getElementById("pin");
  const tryIt = async () => {
    const pin=(inp.value||"").replace(/\D/g,""); if(!pin) return;
    document.getElementById("msg").textContent="Checking…";
    try{ DATA = await decrypt(PACK, pin); store.set(PIN_KEY, pin); history.replaceState({v:"home"},""); render(); }
    catch(_){ document.getElementById("msg").textContent="That PIN didn't work."; inp.value=""; inp.focus(); }
  };
  inp.addEventListener("change", tryIt);
  inp.addEventListener("keydown", e => { if(e.key==="ArrowDown"){ e.preventDefault(); document.getElementById("go").focus(); } });
  document.getElementById("go").onclick = tryIt;
  inp.focus();
}

async function load(){
  try{
    const r = await fetch("jobs.enc.json?t="+Date.now(), {cache:"no-store"});
    if(!r.ok) throw new Error(r.status);
    PACK = await r.json();
  }catch(_){
    app.innerHTML = `<div class="empty">Couldn't load jobs.<br>Check your phone's connection.</div>`; return;
  }
  const pin = store.get(PIN_KEY);
  if(pin){
    try{ DATA = await decrypt(PACK, pin); if(!history.state) history.replaceState({v:"home"},""); render(); return; }
    catch(_){ store.del(PIN_KEY); }
  }
  pinScreen();
}
load();
// refresh data when the app comes back into view
document.addEventListener("visibilitychange", async () => {
  if(document.visibilityState!=="visible" || !DATA) return;
  try{
    const r = await fetch("jobs.enc.json?t="+Date.now(), {cache:"no-store"}); if(!r.ok) return;
    const p = await r.json(); if(PACK && p.ct===PACK.ct) return;
    PACK = p; DATA = await decrypt(PACK, store.get(PIN_KEY)||""); rememberFocus(); render();
  }catch(_){}
});
</script>
</body>
</html>
